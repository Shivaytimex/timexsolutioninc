name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manual trigger option

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build
        env:
          CI: true

      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e  # Exit on error
            
            echo "🔄 Starting deployment process..."
            
            # Navigate to the live project directory
            cd /home/ubuntu/timexsolutioninc
            
            # Pull the exact latest main branch from the transferred repository
            echo "📥 Pulling latest code..."
            git remote set-url origin https://github.com/Shivaytimex/timexsolutioninc.git
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            
            # Install dependencies (including devDependencies for build)
            echo "📦 Installing dependencies..."
            npm ci
            
            # Build project
            echo "🏗️ Building project..."
            npm run build
            
            # Restart/Reload server
            echo "♻️ Reloading server..."
            
            # For Nginx (static files)
            if command -v nginx &> /dev/null; then
                sudo systemctl reload nginx && echo "Nginx reloaded" || echo "⚠️ Could not reload nginx (check sudo permissions)"
            fi
            
            # For PM2 (if using preview server)
            if command -v pm2 &> /dev/null; then
                pm2 restart timexsolutioninc 2>/dev/null || echo "PM2 not managing this app"
            fi
            
            echo "✅ Deployment completed successfully!"
            echo "🎉 Site is now live with latest changes!"

      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "🎉 Deployment to VPS successful!"
          echo "🌐 Site URL: Check your domain"
          
      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs above for details."

